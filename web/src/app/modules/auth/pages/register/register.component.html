<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>SmartLook</h1>
      <p>Crea tu cuenta como cliente</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="nombres">Nombres</label>
          <input type="text" id="nombres" formControlName="nombres" placeholder="Juan Carlos">
        </div>
        <div class="form-group">
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" formControlName="apellidos" placeholder="Pérez Gómez">
        </div>
      </div>

      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" formControlName="correo" placeholder="usuario@smartlook.com">
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" formControlName="telefono" placeholder="70000000">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" formControlName="password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="password_confirm">Confirmar Contraseña</label>
          <input type="password" id="password_confirm" formControlName="password_confirm" placeholder="••••••••">
        </div>
      </div>

      <div class="form-group">
        <label for="direccion">Dirección (Opcional)</label>
        <input type="text" id="direccion" formControlName="direccion" placeholder="Av. Principal #123">
      </div>

      <div class="form-group">
        <label for="fecha_nacimiento">Fecha de Nacimiento (Opcional)</label>
        <input type="date" id="fecha_nacimiento" formControlName="fecha_nacimiento">
      </div>

      <div class="alert alert-success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || registerForm.invalid">
        <app-loading-spinner *ngIf="loading" message="Registrando..."></app-loading-spinner>
        <span *ngIf="!loading">Registrarse</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión aquí</a></p>
    </div>
  </div>
</div>
