<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>SmartLook</h1>
      <p>Crea tu cuenta como cliente</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="nombres">Nombres</label>
          <input type="text" id="nombres" formControlName="nombres" placeholder="Juan Carlos">
        </div>
        <div class="form-group">
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" formControlName="apellidos" placeholder="Pérez Gómez">
        </div>
      </div>

      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" formControlName="correo" placeholder="usuario@smartlook.com">
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" formControlName="telefono" placeholder="70000000">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-with-icon">
            <input
              [type]="mostrarPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="••••••••"
            >
            <button
              type="button"
              class="toggle-visibility"
              (click)="mostrarPassword = !mostrarPassword"
              [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <svg *ngIf="!mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l18 18"/>
                <path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/>
                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-3.22 4.36M6.61 6.61A18.5 18.5 0 0 0 1 12s4 8 11 8a10.9 10.9 0 0 0 5.11-1.27"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="password_confirm">Confirmar Contraseña</label>
          <div class="input-with-icon">
            <input
              [type]="mostrarPasswordConfirm ? 'text' : 'password'"
              id="password_confirm"
              formControlName="password_confirm"
              placeholder="••••••••"
            >
            <button
              type="button"
              class="toggle-visibility"
              (click)="mostrarPasswordConfirm = !mostrarPasswordConfirm"
              [attr.aria-label]="mostrarPasswordConfirm ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <svg *ngIf="!mostrarPasswordConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="mostrarPasswordConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l18 18"/>
                <path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/>
                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-3.22 4.36M6.61 6.61A18.5 18.5 0 0 0 1 12s4 8 11 8a10.9 10.9 0 0 0 5.11-1.27"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="direccion">Dirección (Opcional)</label>
        <input type="text" id="direccion" formControlName="direccion" placeholder="Av. Principal #123">
      </div>

      <div class="form-group">
        <label for="fecha_nacimiento">Fecha de Nacimiento (Opcional)</label>
        <input type="date" id="fecha_nacimiento" formControlName="fecha_nacimiento">
      </div>

      <div class="alert alert-success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || registerForm.invalid">
        <app-loading-spinner *ngIf="loading" message="Registrando..."></app-loading-spinner>
        <span *ngIf="!loading">Registrarse</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión aquí</a></p>
    </div>
  </div>
</div>
