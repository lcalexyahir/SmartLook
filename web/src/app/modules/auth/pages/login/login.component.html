<div class="auth-container">
  <div class="auth-visual">
    <svg class="auth-visual__motif" viewBox="0 0 240 240" aria-hidden="true">
      <defs>
        <g id="hanger">
          <path d="M20 4 L20 10 M6 24 L20 10 L34 24 L30 30 L20 22 L10 30 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </defs>
      <use href="#hanger" x="10" y="10" opacity="0.5"/>
      <use href="#hanger" x="70" y="30" opacity="0.3"/>
      <use href="#hanger" x="150" y="14" opacity="0.45"/>
      <use href="#hanger" x="30" y="90" opacity="0.25"/>
      <use href="#hanger" x="110" y="100" opacity="0.5"/>
      <use href="#hanger" x="190" y="90" opacity="0.3"/>
      <use href="#hanger" x="55" y="170" opacity="0.4"/>
      <use href="#hanger" x="140" y="180" opacity="0.25"/>
      <use href="#hanger" x="200" y="160" opacity="0.5"/>
    </svg>

    <p class="auth-visual__tagline">Prueba prendas con realidad aumentada y reserva en la sucursal más cercana, todo desde una cuenta.</p>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/images/logotipo-smartlook.jpeg" alt="SmartLook" class="auth-header__logo">
        <p>Inicia sesión para continuar</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input
            type="email"
            id="correo"
            formControlName="correo"
            placeholder="usuario@smartlook.com"
            [class.error]="correoControl?.invalid && correoControl?.touched"
          >
          <div class="error-message" *ngIf="correoControl?.invalid && correoControl?.touched">
            <span *ngIf="correoControl?.errors?.['required']">El correo es requerido.</span>
            <span *ngIf="correoControl?.errors?.['email']">Ingrese un correo válido.</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-with-icon">
            <input
              [type]="mostrarPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="••••••••"
              [class.error]="passwordControl?.invalid && passwordControl?.touched"
            >
            <button
              type="button"
              class="toggle-visibility"
              (click)="mostrarPassword = !mostrarPassword"
              [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <svg *ngIf="!mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l18 18"/>
                <path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/>
                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-3.22 4.36M6.61 6.61A18.5 18.5 0 0 0 1 12s4 8 11 8a10.9 10.9 0 0 0 5.11-1.27"/>
              </svg>
            </button>
          </div>
          <div class="error-message" *ngIf="passwordControl?.invalid && passwordControl?.touched">
            <span *ngIf="passwordControl?.errors?.['required']">La contraseña es requerida.</span>
            <span *ngIf="passwordControl?.errors?.['minlength']">Mínimo 6 caracteres.</span>
          </div>
        </div>

        <div class="alert alert-danger" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || loginForm.invalid">
          <app-loading-spinner *ngIf="loading" message="Iniciando..."></app-loading-spinner>
          <span *ngIf="!loading">Iniciar Sesión</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>¿No tienes cuenta? <a routerLink="/auth/registro">Regístrate aquí</a></p>
      </div>
    </div>
  </div>
</div>
