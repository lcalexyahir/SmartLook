<div class="store-container">
  <div class="header">
    <h2>Gestión de Sucursales</h2>
    <button class="btn btn-primary" (click)="showForm = !showForm">
      {{ showForm ? 'Cancelar' : 'Nueva Sucursal' }}
    </button>
  </div>

  <div class="card" *ngIf="showForm">
    <h3>Registrar Sucursal</h3>
    <form [formGroup]="branchForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="ciudad">Ciudad</label>
        <select id="ciudad" formControlName="id_ciudad">
          <option value="">Seleccione ciudad</option>
          <option *ngFor="let city of cities" [value]="city.id_ciudad">
            {{ city.nombre }} - {{ city.pais?.nombre }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" formControlName="nombre" placeholder="SmartLook Centro">
      </div>
      <div class="form-group">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" formControlName="direccion" placeholder="Av. Principal #123">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="text" id="telefono" formControlName="telefono" placeholder="70000000">
        </div>
        <div class="form-group">
          <label for="fecha">Fecha Apertura</label>
          <input type="date" id="fecha" formControlName="fecha_apertura">
        </div>
      </div>
      <button type="submit" class="btn btn-success" [disabled]="branchForm.invalid">Guardar</button>
    </form>
  </div>

  <div class="table-container">
    <table class="table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Ciudad</th>
          <th>Dirección</th>
          <th>Teléfono</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let branch of branches">
          <td>{{ branch.nombre }}</td>
          <td>{{ branch.ciudad?.nombre }}</td>
          <td>{{ branch.direccion }}</td>
          <td>{{ branch.telefono || 'N/A' }}</td>
          <td>
            <span class="badge" [class.active]="branch.estado === 'ACTIVA'">
              {{ branch.estado }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
