<!-- web/src/app/modules/store/pages/city-management/city-management.component.html -->
<div class="store-container">
  <nav class="tabs">
    <a routerLink="/store/sucursales" routerLinkActive="active">Sucursales</a>
    <a routerLink="/store/ciudades" routerLinkActive="active">Ciudades</a>
  </nav>

  <div class="header">
    <h2>Gestión de Ciudades</h2>
    <button class="btn btn-primary" (click)="showForm ? cancelar() : nuevaCiudad()">
      {{ showForm ? 'Cancelar' : 'Nueva Ciudad' }}
    </button>
  </div>

  <div class="card" *ngIf="showForm">
    <h3>{{ editandoId ? 'Editar Ciudad' : 'Registrar Ciudad' }}</h3>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <form [formGroup]="cityForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="pais">País</label>
        <select id="pais" formControlName="id_pais">
          <option value="">Seleccione país</option>
          <option *ngFor="let country of countries" [value]="country.id_pais">
            {{ country.nombre }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" formControlName="nombre" placeholder="Santa Cruz de la Sierra">
      </div>
      <div class="form-group" *ngIf="editandoId">
        <label>
          <input type="checkbox" formControlName="estado"> Activa
        </label>
      </div>
      <button type="submit" class="btn btn-success" [disabled]="cityForm.invalid">Guardar</button>
    </form>
  </div>

  <div class="table-container">
    <table class="table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>País</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let city of cities">
          <td>{{ city.nombre }}</td>
          <td>{{ city.pais?.nombre }}</td>
          <td>
            <span class="badge" [class.active]="city.estado">
              {{ city.estado ? 'Activa' : 'Inactiva' }}
            </span>
          </td>
          <td>
            <button class="btn btn-link" (click)="editarCiudad(city)">Editar</button>
            <button class="btn btn-link danger" (click)="eliminarCiudad(city)">Eliminar</button>
          </td>
        </tr>
        <tr *ngIf="cities.length === 0"><td colspan="4">No hay ciudades registradas.</td></tr>
      </tbody>
    </table>
  </div>
</div>
