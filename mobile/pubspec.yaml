name: smartlook_mobile
description: SmartLook - Sistema omnicanal e-commerce y POS multi-sucursal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Estado
  provider: ^6.1.1

  # Red
  dio: ^5.4.0
  connectivity_plus: ^6.0.2

  # Pagos
  flutter_stripe: ^11.1.0

  # Código QR (CU16 - punto de venta)
  qr_flutter: ^4.1.0

  # Almacenamiento
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Utilidades
  intl: ^0.19.0
  cached_network_image: ^3.3.1

  # Formularios
  flutter_form_builder: ^9.2.0

  # Vestidor Virtual - CU17 (AR 2D)
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.14.0
  permission_handler: ^11.3.1
  geolocator: ^14.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true